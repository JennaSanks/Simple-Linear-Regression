<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salary Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Salary Prediction</h1>

        <form method="POST">

            <label>Years of Experience</label>

            <input
                type="number"
                name="years"
                step="0.1"
                placeholder="Enter years of experience"
                required
            >

            <br>

            <button type="submit">
                Predict Salary
            </button>

        </form>

        {% if prediction is not none %}

        <div class="result">
            Predicted Salary: ₹{{ prediction }}
        </div>

        {% endif %}

    </div>

</body>

</html>
